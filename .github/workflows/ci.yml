# PR gate. The main package checks are hermetic; the separate native QUIC image
# job compiles the pinned experimental Node runtime and runs its native smoke.
# Soaks, fuzz, browser, and differential lanes live in nightly.yml.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the whitespace check can diff the PR's committed range.
          fetch-depth: 0

      # pnpm version comes from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r build

      - name: Test
        run: pnpm test

      - name: Typecheck (per package)
        run: |
          set -euo pipefail
          for p in transport webtransport quic playback loc player browser msf playa; do
            echo "── tsc: packages/$p"
            pnpm --dir "packages/$p" exec tsc --noEmit
          done

      - name: Typecheck (simulation suites + test-support)
        run: pnpm typecheck:tests

      # The Vitest config aliases workspace packages to src, so the test suite
      # deliberately never loads the built `exports` map. This is the only PR
      # gate covering that boundary — without it a source-green change could
      # ship a broken bundle.
      - name: Package export smoke (built bundles)
        run: pnpm smoke:exports

      - name: Typecheck + run the media conformance corpus
        run: |
          set -euo pipefail
          pnpm --filter @moqt/media-conformance-runner typecheck
          pnpm test:corpus

      - name: Examples (player build + node-relay typecheck)
        run: |
          set -euo pipefail
          pnpm --filter @moqt/examples build
          pnpm --filter @moqt/example-node-relay typecheck

      - name: Whitespace check (committed PR range)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            # push: previous tip when available; first/force pushes fall back to HEAD~1.
            base="${{ github.event.before }}"
            if [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base" 2>/dev/null; then
              base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
            fi
          fi
          echo "Checking whitespace over $base..HEAD"
          git diff --check "$base"..HEAD

      - name: Post-build dirty-tree check
        # Build/test must not mutate tracked files: a diff here means generated
        # output drifted from what is committed (a plain diff --check on a clean
        # checkout would be vacuous — this is the check that has teeth).
        run: |
          set -euo pipefail
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            echo "Working tree dirty after build/test:"
            echo "$status"
            git diff | head -100
            exit 1
          fi

  native-quic-image:
    # Main pushes build this exact image in publish-interop-client.yml. Running
    # both jobs concurrently duplicates a cold Node build and starves each of
    # cache produced by the other; PRs still get the native gate before merge.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Node's QUIC API is compile-time experimental. Building the real image
      # here proves both the pinned linux/x64 runtime and the native smoke test
      # before the same Dockerfile can be published.
      - name: Build native QUIC interop image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/moq-interop-client/Dockerfile.client
          load: true
          tags: moq-playa-interop-client:ci
          build-args: NODE_BUILD_JOBS=4
          cache-from: type=gha,scope=moq-playa-interop-client
          cache-to: type=gha,mode=max,scope=moq-playa-interop-client

      - name: Verify final image runtime and test gate
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/sh moq-playa-interop-client:ci -ceu '
            test -f /app/.tests-passed
            test "$(node --version)" = "v26.8.1"
            node --experimental-quic --input-type=module -e \
              "if (process.features.quic !== true) process.exit(1); await import(\"node:quic\")"
          '
